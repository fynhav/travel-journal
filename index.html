<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel Journal">
<meta name="theme-color" content="#EFE2CB">
<meta name="color-scheme" content="light">
<title>Travel Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="vendor/jszip.min.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url(vendor/plus-jakarta-sans-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:Fraunces;src:url(vendor/fraunces-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--paper:#F6F0E4;--card:#FFFDF8;--ink:#2E2823;--muted:#7A6E60;--line:#EADFC9;--band:#EFE2CB;--accent:#B5562F;--sel:#F6DECB;--danger:#A8402F;--serif:Fraunces,"New York","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 120px);overflow-x:clip;max-width:100vw}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--band);border-bottom:1px solid #E3D5BA;padding:calc(env(safe-area-inset-top) + 20px) 18px 14px}
.top .row{display:flex;align-items:center;gap:8px;min-height:44px;max-width:720px;margin:0 auto}
.top .tt{flex:1;min-width:0}
.top.c .tt{text-align:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;color:#6B5F50;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font:600 28px/1.15 var(--serif);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.c h1{font-size:22px}
.top h1 .yr{color:#8B7F70}
.bookbtn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px 0 14px;border:0;border-radius:21px;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;flex:none;box-shadow:0 4px 12px rgba(181,86,47,.3)}
.cbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid #E3D5BA;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.txtbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:8px;cursor:pointer}
.wrap{padding:12px 16px 0;max-width:720px;margin:0 auto}
.wrap.padsel{padding-bottom:130px}
.mrow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:14px 16px 0;max-width:720px;margin:0 auto;scrollbar-width:none}
.mrow::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 16px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:#5C5043;cursor:pointer;flex:none;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pill.ghost{background:transparent;border-color:transparent;color:var(--accent);font-weight:700}
.okb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border-radius:15px;background:#E1EAD3;color:#33502A;font-size:11.5px;font-weight:700;flex:none;margin-left:auto}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:10px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.dedit{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:inherit;color:inherit;padding:6px 0}.dedit span{opacity:.6;display:inline-flex}.dedit:active{opacity:.6}
.cal{touch-action:pan-y;background:var(--card);border:1px solid #F0E8D8;border-radius:24px;overflow:hidden;box-shadow:0 6px 24px rgba(120,90,50,.10)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #F0E8D8}
.cell{position:relative;height:74px;border:0;background:transparent;padding:6px 0 0 8px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;cursor:pointer;min-width:0}
.num{display:block;font-size:12px;font-weight:600;line-height:20px;width:22px;height:20px;text-align:center;border-radius:10px;margin-left:-3px}
.out .num{opacity:.38}
.today .num{background:var(--accent);color:#fff}
.cell.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.bk{position:absolute;top:27px;bottom:5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:15px 4px 0;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;pointer-events:none}
.bk .lb{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bk.hasch{padding-right:16px}
.bk.empty{font-weight:500;font-style:italic;color:#6B5F50!important}
.bk.narrow{padding:15px 2px 0;font-size:10.5px}
.bk.narrow .lb{white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bgf{position:absolute;top:4px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #fff,0 0 0 2px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;font-style:normal}
.bk .ch{position:absolute;right:5px;top:50%;margin-top:3px;transform:translateY(-50%);opacity:.6;font-weight:400;font-size:17px;font-style:normal}
.hint{color:var(--muted);font-size:13px;margin:8px 2px}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
h3{font:600 19px/1.3 var(--serif);margin:2px 0 6px}
.sec{background:var(--card);border:1px solid #F0E8D8;border-radius:24px;padding:16px;margin:12px 0 0;box-shadow:0 4px 16px rgba(120,90,50,.07)}
.hero{position:relative;display:block;width:100%;height:140px;border-radius:28px;overflow:hidden;border:0;padding:0;margin-top:14px;box-shadow:0 8px 24px rgba(120,90,50,.16);cursor:pointer;text-align:left;background:var(--band)}
.hero.big{height:168px;cursor:default;margin-top:14px}
.hero > svg,.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .panel{position:absolute;left:10px;right:10px;bottom:10px;height:58px;border-radius:20px;background:rgba(255,253,248,.94);display:flex;align-items:center;gap:10px;padding:0 8px 0 16px}
.panel .pt{flex:1;min-width:0}
.panel small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel b{display:block;font:600 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.hp{position:absolute;bottom:12px;display:flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:rgba(255,253,248,.94);font-size:12.5px;font-weight:700;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp.l{left:12px}
.hp.r{right:12px;padding:0 6px 0 12px;cursor:pointer;overflow:visible;max-width:none}
.hp .plus{width:22px;height:22px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.meta{display:flex;align-items:center;gap:12px;margin:14px 20px 0;max-width:680px}
@media(min-width:760px){.meta{margin-left:auto;margin-right:auto}}
.meta .ml{font-size:13px;font-weight:600;color:#5C5043}
.meta .ms{font-size:12px;color:var(--muted);margin-top:2px}
.prog{width:112px;flex:none}
.prog .pt{font-size:11.5px;font-weight:700;color:#5C5043;text-align:right}
.pb{height:6px;border-radius:3px;background:#E9DEC8;margin-top:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ustat{display:flex;gap:10px}.ustat>div{flex:1;background:var(--paper);border-radius:16px;padding:12px 14px}.ustat b{display:block;font:600 24px/1.1 var(--serif)}.ustat span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.ulist{margin-top:10px}.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0E8D8;font-size:14px}.urow small{display:block;color:var(--muted);font-size:12px;margin-top:1px}.urow b{font-weight:700;white-space:nowrap}
.fbbox{margin-top:18px;padding-top:16px;border-top:1px solid #F0E8D8}.fbbox textarea{min-height:76px;margin-top:6px}
.sortrow{padding:10px 0;border-bottom:1px solid #F0E8D8}.sortrow b{display:block;font:600 15px/1.3 var(--serif)}.sortrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.tools{display:flex;gap:8px;padding:12px 16px 0;max-width:720px;margin:0 auto}
.tbtn{flex:1;height:44px;border-radius:22px;border:1.5px solid #EBCFB8;background:#FBEFE4;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.tbtn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn:disabled{opacity:.55}
.undo{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer}
.story{padding:4px 2px 6px}
.story h1{font:600 28px/1.15 var(--serif);margin:6px 0 14px;letter-spacing:-.2px}
.story h2{font:600 18px/1.25 var(--serif);margin:22px 0 6px;color:var(--accent)}
.story p{font-size:16px;line-height:1.62;margin:0 0 12px;color:#3a3128}
.story blockquote{margin:18px 0;padding:2px 0 2px 14px;border-left:3px solid #E7C9B6;font:italic 500 19px/1.4 var(--serif);color:#5C4636}
.story .end{margin-top:20px;font-style:italic;color:var(--muted)}
.tabs{display:flex;gap:8px;padding:12px 16px 0;max-width:720px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.cd{background:var(--card);border:1px solid #F0E8D8;border-radius:24px;padding:16px;box-shadow:0 4px 16px rgba(120,90,50,.07);margin-top:12px}
.cd .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.q{flex:1;font:600 16.5px/1.3 var(--serif)}
.qh input{flex:1;margin:0}
.ckk{width:22px;height:22px;border-radius:50%;background:#DCEBD3;display:flex;align-items:center;justify-content:center;flex:none}
.x{border:0;background:transparent;color:#A89B88;font-size:20px;width:26px;height:26px;border-radius:13px;cursor:pointer;flex:none;line-height:1;padding:0}
.cd textarea{background:transparent;border:0;border-radius:0;padding:0;min-height:52px;font-size:15px;line-height:1.55;color:#4A4036}
.cd textarea::placeholder{color:#8B7F70;font-style:italic}
.cd textarea:focus{border:0}
input,textarea,select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:none;line-height:1.45}
input.title{font:600 19px/1.3 var(--serif);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 2px 8px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted)}
label > input,label > select,label > textarea{margin-top:4px;color:var(--ink)}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dates label{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:44px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--t);border:1.5px solid var(--c);border-radius:20px;padding:4px 4px 4px 12px;font-weight:600;font-size:15px}
.chip button{border:0;background:transparent;width:26px;height:26px;border-radius:13px;font-size:17px;line-height:1;cursor:pointer;color:var(--muted)}
.arrow{color:var(--muted);font-weight:700}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.dayrow{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);font-size:14px}
.dayrow input,.dayrow select{margin:0}
.dayrow.mc{grid-template-columns:78px minmax(0,1fr) 74px;gap:6px}
.dayrow select{padding:10px 2px 10px 6px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns.end{margin:12px 0 20px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:11px 16px;font-size:14.5px;font-weight:600;cursor:pointer;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn[disabled]{opacity:.55}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:16px;overflow:hidden;border:0;padding:0;background:var(--line);cursor:pointer;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(46,40,35,.6));color:#fff;font-size:10.5px;padding:10px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-ph{display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--paper);border:1.5px dashed #D9CBB0;color:var(--muted);font-size:13px}
.add-ph span:first-child{font-size:26px;line-height:1}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid #F0E8D8;border-radius:20px;padding:8px 8px 8px 16px;margin-bottom:10px;font-size:13.5px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--band);border-top:1px solid #E3D5BA;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px)}
.selbar > div{max-width:720px;margin:0 auto}
.selbar .btns{margin-top:8px}
.selbar .btn{flex:1}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:min(350px,calc(100% - 40px));bottom:calc(env(safe-area-inset-bottom) + 16px);height:66px;border-radius:33px;background:var(--card);border:1px solid #EADFC9;box-shadow:0 10px 30px rgba(120,90,50,.2);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:25}
.nv{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#8B7F70;cursor:pointer;padding:0}
.nv.on{background:#F3E2CF;color:var(--accent)}
.micfab{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(181,86,47,.4);margin-top:-6px;cursor:pointer;padding:0}
.nav.bar{gap:8px;justify-content:flex-start}
.recbtn{flex:1;height:50px;border-radius:25px;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:700;cursor:pointer}
.circ{width:50px;height:50px;border-radius:50%;border:0;background:#F3E2CF;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.crow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid #F0E8D8;border-radius:24px;padding:8px;box-shadow:0 4px 16px rgba(120,90,50,.07);margin-top:10px;cursor:pointer}
.crow .th{width:84px;height:84px;border-radius:17px;overflow:hidden;position:relative;flex:none;background:var(--band)}
.crow .th svg,.crow .th img,.cv .th svg,.cv .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.crow b{display:block;font:600 17px/1.25 var(--serif)}
.crow small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid #F0E8D8;border-radius:20px;padding:12px 16px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;font-weight:600;color:#6B5F50}
.sb{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 4px 0}
.bcards{display:flex;gap:12px;overflow-x:auto;padding:10px 16px 6px;margin:0 -16px;scrollbar-width:none}
.bcards::-webkit-scrollbar{display:none}
.cv{flex:none;width:176px;background:var(--card);border:1px solid #F0E8D8;border-radius:24px;padding:8px;box-shadow:0 4px 16px rgba(120,90,50,.08);text-align:left;cursor:pointer}
.cv .th{position:relative;height:112px;border-radius:17px;overflow:hidden;background:var(--band)}
.cv b{display:block;font:600 16px/1.2 var(--serif);margin:10px 4px 0}
.cv small{display:block;margin:5px 4px 4px;font-size:11.5px;font-weight:600;color:#6B5F50}
.tocard{background:#F3E2CF;border-radius:24px;padding:16px;margin-top:16px}
.tocard .btns{margin-top:12px}
.tocard .btn{flex:1}
.safe{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #F0E8D8;border-radius:24px;padding:14px 14px 14px 16px;margin-top:12px;box-shadow:0 4px 16px rgba(120,90,50,.07)}
.safe .ic{width:40px;height:40px;border-radius:50%;background:#E1EAD3;display:flex;align-items:center;justify-content:center;flex:none}
.safe b{display:block;font-size:13.5px}
.sbar{height:6px;border-radius:3px;background:#E9DEC8;margin:8px 0 6px;overflow:hidden}
.sbar i{display:block;height:100%;background:#7FA06B;border-radius:3px;transition:width .3s}
.banner.warn{background:#FBE9E4;border-color:#E7B9AE;color:#8A2B16}
.safe small{color:var(--muted);font-size:12px}
.voice{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.mic{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 14px 7px 11px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--accent)}
.mic[disabled]{opacity:.5}
.vchip{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 10px}
.vchip.bad{color:#8A2B16;background:#FBE9E4;border-color:#E7B9AE}
.vchip button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:4px 6px;cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin-top:12px}
.chk input{width:auto;flex:none;padding:0}
#recov{position:fixed;inset:0;z-index:70;background:var(--paper);display:none;overflow:auto}
#recov.on{display:block}
#recov .rp{text-align:center;padding:30px 28px 0}
#recov .rp small{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#recov .rp h2{font:600 27px/1.25 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 0}
.wv{display:flex;align-items:center;justify-content:center;gap:4px;height:60px;margin-top:28px}
.wv i{display:block;width:5px;height:6px;border-radius:3px;background:var(--accent);transition:height .08s}
.tm{text-align:center;font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;margin-top:14px}
.live{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;font-size:12.5px;font-weight:700;color:#8A2B16}
.live i{width:9px;height:9px;border-radius:50%;background:#D23B1E;display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.stopbtn{display:flex;margin:22px auto 0;width:92px;height:92px;border-radius:50%;border:0;background:#F3DCCB;align-items:center;justify-content:center;cursor:pointer;padding:0}

      if (!r.ok) throw 0;
      const v = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
      if (!v) throw 0;

      if (!this.ok || !navigator.serviceWorker.controller) { if (silent) return ''; await flush(); location.replace('index.html?v=' + encodeURIComponent(v[1])); return 'Updating…'; }
      await this.install(v[1]);

      if (Lock.locked && Lock.ready && !Lock.busy && !Vault.needKey && !['#pw1', '#pw2', '#rk'].some(i => $(i).value)) { location.reload(); return 'Updating…'; }

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}

  const days = range(e.start, e.end);
  L.push(`- **Dates:** ${rangeLabel(e.start, e.end)} (${days.length} day${days.length > 1 ? 's' : ''})`);
  if (e.countries.length) L.push(`- **Country:** ${countryLabel(e)}`);
  L.push('', '## Where I was', ...days.map(d => `- ${fmt(d, LONG)}: ${e.days[d] || '(not noted)'}${viaS(e, d)}${e.countries.length > 1 ? ' (' + dayCountry(e, d) + ')' : ''}`));
  const ans = e.qa.filter(x => x.a.trim());
  if (e.talk.trim()) L.push('', '## My story', '', e.talk.trim());
  if (ans.length) { L.push('', e.talk.trim() ? '## Earlier answers' : '## My notes'); ans.forEach(x => L.push('', `**${x.q || 'Note'}**`, '', x.a.trim())); }

  return L.join('\n');
}

document.addEventListener('change', async ev => {
  const t = ev.target, f = t.dataset.change; if (!f) return;
  const e = cur();
  if (f === 'start' || f === 'end') {
    if (!t.value) { rerender(); return; }
    let s = f === 'start' ? t.value : e.start, en = f === 'end' ? t.value : e.end;
    if (s > en) { if (f === 'start') en = s; else s = en; }
    if (overlaps(s, en, e.id)) { toast('Those dates overlap another chapter'); rerender(); return; }
    e.start = s; e.end = en; await saveEntry(e); rerender();
  } else if (f === 'photos') {
    const files = [...t.files]; t.value = ''; if (files.length) addPhotos(files, e);
  } else if (f === 'sttprov') {
    Vault.stt.provider = t.value; await Vault.saveStt(); openSettings();
  } else if (f === 'sttdiar') {
    Vault.stt.diar = t.checked; await Vault.saveStt();
  } else if (f === 'sttclean') {
    Vault.stt.cleanup = t.checked; await Vault.saveStt();
  } else if (f === 'dc') {
    if (!e.dc) { e.dc = {}; range(e.start, e.end).forEach(d => { e.dc[d] = dayCountry(e, d); }); }
    e.dc[t.dataset.d] = t.value; await saveEntry(e);

});

(() => {

  document.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 55 || Math.abs(dx) < 1.5 * Math.abs(dy) || Date.now() - t0 > 900) return;

  }, { passive: true });
})();

  if (!document.hidden && Lock.ready && !Lock.locked && Lock.hiddenAt && Date.now() - Lock.hiddenAt > 60000) Lock.lock();
  else if (!document.hidden) {
    if (Stt.busy.size) { Stt.hold(); if (Date.now() - Lock.hiddenAt > 5000) Object.entries(Stt.ctl).forEach(([id, c]) => { if (Stt.hid[id]) c.abort('restart'); }); } // the paused upload won't finish: send it again now
    Stt.run();
  }
  if (!document.hidden) Store.refresh();
});

// ---------- lock screen ----------
const Lock = {
  mode: 'unlock', busy: false, locked: true, ready: false, hiddenAt: 0, y: 0, gen: 0,
  async init(dbOk) {
    $('#lockForm').addEventListener('submit', ev => this.submit(ev));
    if (!dbOk) { this.setMode('setup', "Storage isn't available in this browser mode, so the journal can't open here."); $('#lockBtn').disabled = true; return; }
    this.setMode((await DB.get('meta', 'vault')) ? 'unlock' : 'setup');
    this.ready = true;
  },
  setMode(m, msg) {
    this.mode = m; const setup = m === 'setup', rec = m === 'recover';
    $('#lock').classList.add('on');
    ['#pw1', '#pw2', '#rk'].forEach(i => { $(i).value = ''; });
    $('#rk').hidden = !rec; $('#pw2').hidden = !(setup || rec);
    $('#pw1').placeholder = rec ? 'New password' : 'Password';
    $('#pw1').autocomplete = (setup || rec) ? 'new-password' : 'current-password';
    $('#lockBtn').textContent = setup ? 'Create password' : rec ? 'Reset password' : 'Unlock';
    $('#lockMsg').textContent = msg || (setup ? 'Choose a password. It encrypts everything on this phone. You will get a recovery key next, in case you forget it.' : rec ? 'Enter your recovery key and choose a new password.' : 'Enter your password');
    $('#lockForgot').hidden = m !== 'unlock'; $('#lockBack').hidden = !rec; $('#lockErase').hidden = setup;
  },
  say(m) { $('#lockMsg').textContent = m; },
  async submit(ev) {
    ev.preventDefault(); if (this.busy) return;
    const p1 = $('#pw1').value, p2 = $('#pw2').value, rk = $('#rk').value, btn = $('#lockBtn'), m = this.mode;
    if (m === 'setup' || m === 'recover') {
      if (m === 'recover' && !rkDecode(rk)) return this.say("That doesn't look like a recovery key. It has 26 letters and numbers.");
      if (p1.length < 8) return this.say('Use at least 8 characters.');
      if (p1 !== p2) return this.say("The two passwords don't match.");
    } else if (!p1) return;
    this.busy = true; btn.disabled = true; this.say('One moment…');
    try {
      let code = null;
      if (m === 'setup') code = await Vault.setup(p1);
      else if (m === 'recover') { if (!(await Vault.recover(rk, p1))) { this.say('That recovery key is not right.'); return; } }
      else {
        const r = await Vault.unlock(p1);
        if (!r) { this.say('That password is not right.'); $('#pw1').select(); return; }
        code = r.recoveryKey || (Vault.needKey ? await Vault.newRecovery(p1) : null);
      }
      Vault.needKey = false;
      this.open();
      if (code) showRecoveryKey(code);
    } catch (err) { this.say('Something went wrong: ' + (err.message || err.name)); }
    finally { this.busy = false; btn.disabled = false; }
  },
  open() {
    this.locked = false; ['#pw1', '#pw2', '#rk'].forEach(i => { $(i).value = ''; }); $('#lock').classList.remove('on');
    if (S.view === 'entry' && !cur()) { S.view = 'cal'; S.openId = null; }
    render(); scrollTo(0, this.y || 0); Stt.run(); Store.refresh();
  },
  async lock() {
    if (this.locked || !this.ready) return;
    this.locked = true; this.gen++;
    try { Rec.stop(); await Rec.done; } catch {}
    try { await flush(); } catch {}
    this.y = scrollY;
    Vault.needKey = keyPending; keyPending = false; rkShown = '';
    urls.forEach(u => URL.revokeObjectURL(u)); urls.clear();
    S.entries = []; S.photos = []; S.audio = []; S.select = null; Stt.busy.clear();
    Vault.key = null; Vault.rec = null; Vault.apiKey = ''; Vault.stt = null; Vault.geo = null; Vault.usage = null; MapV.destroy();
    $('#sheet').classList.remove('on'); $('#sheet .body').innerHTML = ''; $('#app').innerHTML = ''; $('#recov').classList.remove('on'); $('#recov').innerHTML = ''; REdit.open = false; $('#redit').classList.remove('on'); $('#redit').innerHTML = ''; G3.close();
    this.setMode('unlock');
    if (S.update && !Vault.needKey) setTimeout(() => location.reload(), 400); // a new version is waiting: load it now, the app is locked anyway
  },
  async erase() {
    if (!confirm('This permanently deletes every chapter and photo on this phone, and the password. Only do this if you have a backup file to restore from. Continue?')) return;
    await DB.clear('entries'); await DB.clear('photos'); await DB.clear('audio'); await DB.clear('meta');
    try { localStorage.removeItem('tj.lastBackup'); } catch {}
    S.entries = []; S.photos = []; S.audio = []; S.view = 'cal'; S.openId = null;
    this.setMode('setup', 'Journal erased. Choose a new password.');
  }
};

// ---------- start ----------
(async () => {
  const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1);
  let ok = true;
  try { await DB.open(); navigator.storage?.persist?.(); } catch { ok = false; }
  SW.init();
  await Lock.init(ok);
})();
</script>
